name: PHP 8.4 container checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: php84-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell and Compose syntax
        run: |
          for script in docker/container/*.sh; do sh -n "$script"; done
          bash -n docker/tests/smoke.sh
          docker compose config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and lint PHP 8.4 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          push: false
          platforms: linux/amd64
          tags: easyimages-check:php8.4
          build-args: DEPENDENCY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=check-amd64
          cache-to: type=gha,mode=max,scope=check-amd64
      - name: Check startup, persistence, and HTTP restrictions
        run: bash docker/tests/smoke.sh easyimages-check:php8.4
