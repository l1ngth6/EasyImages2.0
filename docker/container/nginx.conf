user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    include /etc/nginx/easyimage-access-log.conf;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /app/web;
        index index.php index.html;
        client_max_body_size 520m;

        location = /healthz {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/local/share/easyimage/health.php;
            fastcgi_pass unix:/run/php/easyimage.sock;
            access_log off;
        }

        location = /config { return 403; }
        location ^~ /config/ { deny all; }
        location = /docs { return 403; }
        location ^~ /docs/ { deny all; }
        location = /admin/logs { return 403; }
        location ^~ /admin/logs/ { deny all; }

        location ~ (^|/)\. {
            deny all;
        }

        # These rules must precede the generic PHP handler.
        location ~* ^/(i|public)/.*\.(php[0-9]*|phtml|phar)(/|$) {
            deny all;
        }

        location ~* \.(ini|log|bak|conf|sh|ya?ml|sql|env)$ {
            deny all;
        }

        location ~ ^/install/.*\.php$ {
            if (-f /app/web/config/install.lock) { return 404; }
            include /etc/nginx/easyimage-fastcgi.conf;
        }

        location /install/ {
            if (-f /app/web/config/install.lock) { return 404; }
        }

        location ~ \.php$ {
            include /etc/nginx/easyimage-fastcgi.conf;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
